apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary
  namespace: steward-canary
  labels: &id001
    app: canary
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        fsGroup: 10001
      containers:
      - name: canary
        image: ghcr.io/ai13f/steward-canary:v1.5.1@sha256:20199f96ded1d03c7b0067abdfd47077d4ca6d102e8fb75b29ebbc320c3b929b
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: canary-data
