apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-ports
  namespace: steward-canary
  labels: &id001
    app: canary-ports
spec:
  replicas: 0
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: ports
        image: ghcr.io/ai13f/steward-canary:v1.1.1@sha256:1b8ef6cc65cb22e2fa89cd36c36364b81fd648a159816d0f89f52ad8d5349b58
        ports:
        - containerPort: 9000
          protocol: TCP
        - containerPort: 8080
          protocol: TCP
          name: http
        - containerPort: 9000
          protocol: UDP
