# Custom patch status-uptime-fix (k8s-image-steward patches/steward-canary/status-uptime-fix), mounted with
# subPath over /app/app/status.py. Upstream bug: ai13f/steward-canary-src#1 (uptime_s reports milliseconds).
apiVersion: v1
kind: ConfigMap
metadata:
  name: canary-status-overlay
  namespace: steward-canary
data:
  status.py: |
    """The /status payload (steward overlay: uptime in seconds, ai13f/steward-canary-src#1)."""

    from __future__ import annotations

    import time


    def uptime_s(started: float) -> float:
        """Seconds since `started` (a time.monotonic() value)."""
        return round(time.monotonic() - started, 3)


    def snapshot(started: float, ticks: int, schema_version: int) -> dict:
        return {"uptime_s": uptime_s(started), "ticks": ticks, "schema_version": schema_version}
